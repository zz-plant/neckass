<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found | The Gazette</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="alternate" type="application/rss+xml" title="The Gazette" href="/feed.xml">

</head>
<body>
    <a class="skip-link" href="#not-found-heading">Skip to notice</a>
    <div class="page-shell">
        <header class="masthead">
            <div class="masthead__folio">
                <p class="masthead__plate">
                    <a href="/"><span class="masthead__name">The Gazette</span></a>
                </p>
                <nav class="top-nav" aria-label="Site">
                    <a href="/">Today</a>
                    <a href="/archive">Back issues</a>
                    <a href="/about">Reference</a>
                    <a href="/prompts">Standards</a>
                </nav>
            </div>
        </header>

        <main class="container page-grid page-grid--single" id="not-found-heading">
            <section class="seo-copy" aria-labelledby="not-found-title">
                <h1 class="page-title" id="not-found-title">404 — no such edition</h1>
                <figure class="cut cut--mark">
                    <img src="/assets/cuts/press.svg" width="158" height="146" alt="Line-cut of a screw press." loading="lazy">
                    <figcaption>The press ran this morning. This page was not on it.</figcaption>
                </figure>
            </section>
        </main>
    </div>
