<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neckass Digital Gazette">
  <!-- The masthead N on newsprint, with the rule that runs under the
       nameplate on the front page. Kept to two shapes and one letter so it
       still reads at 16px in a tab. -->
  <rect width="64" height="64" rx="10" fill="#241c14"/>
  <text x="32" y="42" text-anchor="middle"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="40" font-weight="700" fill="#fbfaf6">N</text>
  <rect x="16" y="49" width="32" height="3" fill="#b32b1c"/>
</svg>
