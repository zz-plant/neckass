<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 60 20" width="60" height="20" role="img" aria-label="Printer's ornament">
    <title>Printer's ornament</title>
    <style><![CDATA[
        /* The dingus a compositor sets between departments. Two switches:

             --flourish: 0    drops the side leaves, leaving the end mark alone
             --ink            the colour of the ink

           Set --flourish to 0 and scale it to about 10px to use the centre
           lozenge as an end mark at the foot of an item. */
        svg { --ink-default: #1c1a19; }
        @media (prefers-color-scheme: dark) { svg { --ink-default: #ece7dc; } }
        .ink { fill: var(--ink, var(--ink-default)); }
        .line {
            fill: none;
            stroke: var(--ink, var(--ink-default));
            stroke-width: 1.6;
            stroke-linecap: round;
        }
        .flourish { opacity: var(--flourish, 1); }
    ]]></style>

    <path class="ink" d="M36 3 l7 7 l-7 7 l-7 -7 z" />
    <g class="flourish">
        <path class="line" d="M24 10 q-6 -7 -14 -5 q6 3 6 5 q0 2 -6 5 q8 2 14 -5 z" />
        <path class="line" d="M48 10 q6 -7 14 -5 q-6 3 -6 5 q0 2 6 5 q-8 2 -14 -5 z" />
        <circle class="ink" cx="21" cy="10" r="1.6" />
        <circle class="ink" cx="51" cy="10" r="1.6" />
    </g>
</svg>
