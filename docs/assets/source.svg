<?xml version="1.0" encoding="UTF-8"?>
<!--
  Design source for every PNG in this directory. `bun run assets:generate`
  composites this onto each scene canvas; nothing here is rendered by the site
  itself, so it uses generic serif/sans families that any renderer resolves
  rather than the self-hosted Fraunces the site ships.

  Palette matches styles.css: newsprint #efeae0, ink #1c1a19, display type set
  in that same ink, ledger teal #175049.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="Neckass Digital Gazette front page with a sample satirical headline">
  <!-- Newsprint sheet -->
  <rect x="0" y="0" width="400" height="200" rx="3" fill="#efeae0"/>

  <!-- Masthead -->
  <text x="200" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1c1a19">Neckass</text>
  <text x="200" y="57" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#4e4a42" letter-spacing="4.5">DIGITAL GAZETTE</text>

  <!-- Masthead double rule -->
  <line x1="26" y1="70" x2="374" y2="70" stroke="#1c1a19" stroke-width="1.6"/>
  <line x1="26" y1="74" x2="374" y2="74" stroke="#1c1a19" stroke-width="0.5"/>

  <!-- Press-red kicker -->
  <rect x="26" y="86" width="58" height="13" fill="#175049"/>
  <text x="55" y="95.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#f4f0e7" letter-spacing="1.3">BREAKING</text>

  <!-- Headline -->
  <text x="26" y="127" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#1c1a19">Local man opens 19 tabs</text>
  <text x="26" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#1c1a19">to compare cereal prices</text>

  <!-- Footer rule and dateline -->
  <line x1="26" y1="168" x2="374" y2="168" stroke="#1c1a19" stroke-opacity="0.28" stroke-width="0.6"/>
  <text x="26" y="182" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#4e4a42" letter-spacing="0.7">NECKASS.COM · SATIRE HEADLINE GENERATOR</text>
</svg>
